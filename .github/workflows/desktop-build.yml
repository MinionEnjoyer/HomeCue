name: Desktop build
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: npm ci
      - name: Build HomeCue service sidecar
        shell: pwsh
        run: |
          python -m pip install . pyinstaller
          pyinstaller --clean --noconfirm --onefile --noconsole --collect-all cuesdk --name homecue-service homecue/__main__.py
          if (-not (Select-String -Path build/homecue-service/Analysis-00.toc -Pattern "iCUESDK.x64_2019.dll" -Quiet)) {
            throw "Corsair iCUE SDK DLL was not collected into the service bundle"
          }
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/homecue-service.exe apps/desktop/src-tauri/binaries/homecue-service-x86_64-pc-windows-msvc.exe
      - name: Typecheck and build web app
        run: npm run build
      - name: Test Tauri service lifecycle helpers
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
      - name: Build NSIS installer
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HomeCue-Windows-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
