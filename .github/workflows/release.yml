name: Windows release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "desktop-v$version") {
            throw "Tag ${{ github.ref_name }} must match desktop-v$version"
          }
      - name: Build HomeCue service sidecar
        shell: pwsh
        run: |
          python -m pip install . pyinstaller
          pyinstaller --clean --noconfirm --onefile --name homecue-service homecue/__main__.py
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/homecue-service.exe apps/desktop/src-tauri/binaries/homecue-service-x86_64-pc-windows-msvc.exe
      - name: Build signed release and updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: desktop-v__VERSION__
          releaseName: HomeCue __VERSION__
          releaseBody: Signed HomeCue Windows release. Existing installations will discover this update automatically.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
