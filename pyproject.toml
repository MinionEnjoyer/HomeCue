[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homecue"
version = "0.1.0"
description = "Bridge Corsair iCUE RGB lighting to Home Assistant via MQTT"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "cuesdk>=2.0.0",
    "paho-mqtt>=2.0.0",
    "pyyaml>=6.0",
    "pystray>=0.19",
    "Pillow>=9.0",
]

[project.optional-dependencies]
test = [
    "cryptography>=42.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[project.scripts]
homecue = "homecue.__main__:_entry"

[project.gui-scripts]
homecue-tray = "homecue.__main__:_entry_tray"
